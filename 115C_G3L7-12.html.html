<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>翰林三上國語守護島</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#3b3a4a;--sub:#7a7890;--pri:#ff8a65;--pri2:#ff7043;--sea:#a9dcea;--card:#ffffff;--ic:#8fd6b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f0;color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
.facet{clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.btn{background:#fff;padding:.7em 1.2em;font-size:1.05rem;font-weight:700;border-radius:14px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.1),0 3px 8px rgba(40,60,90,.12);transition:transform .1s;min-height:48px}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(135deg,#ffa07a 0 50%,#ff8a65 50%);color:#fff}
.btn.danger{background:#f6d4d4;color:#b23b3b}
.btn.icon{width:52px;padding:0;font-size:1.4rem}
.btn.sm{min-height:42px;padding:.45em 1em;font-size:1rem}
.light{background:linear-gradient(135deg,#fff7d6 0 50%,#ffefb8 50%);padding:.6em 1.1em;font-weight:700;color:#9a6b00;white-space:nowrap}
.light b{font-size:1.25em}

/* 注音：直式，聲調在右上 */
.zy{display:inline-flex;align-items:center;line-height:1}
.zy .h{display:inline-block}
.zc{display:inline-flex;flex-direction:column;align-items:center;position:relative;font-size:.34em;line-height:1.02;vertical-align:middle;margin-left:.1em;padding-right:.55em;font-weight:500}
.zc b{display:block;font-weight:600}
.zc .tn{position:absolute;right:0;top:calc((var(--n) - 1) * 1.02em - .32em);font-style:normal;font-weight:700}
.zc .lt{font-style:normal;line-height:.5;font-weight:900}

/* 標題 */
.title-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.title-bg{position:absolute;inset:0}.title-bg svg{width:100%;height:100%}
.title-card{position:relative;background:linear-gradient(160deg,#ffffff 0 55%,#f4fbff 55%);padding:28px 36px 30px;width:min(560px,92vw);text-align:center}
.title-owl{width:120px;margin:0 auto -6px;animation:bob 3s ease-in-out infinite}
h1{margin:0;line-height:1.05}
h1 .t1{display:block;font-size:1.3rem;color:var(--sub);letter-spacing:.2em}
h1 .t2{display:block;font-size:3.4rem;font-weight:900;letter-spacing:.12em;background:linear-gradient(90deg,#3fae8a,#f08a5d,#9b7ad8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);margin:.4em 0 1em}
.plist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:30vh;overflow:auto;margin-bottom:12px}
.pbtn{background:#eef8f4;padding:.7em 1.1em;border-radius:14px;font-weight:700;font-size:1.05rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);display:flex;gap:.6em;align-items:center}
.plight{color:#b98600;font-size:.9em}
.newp{display:flex;gap:8px}
.newp input{flex:1;min-width:0;font-size:1.05rem;padding:.6em .8em;border:2px solid #dfe7ee;border-radius:12px;font-family:inherit}

/* 地圖 */
.map-screen{position:absolute;inset:0;background:linear-gradient(180deg,#cdeef5,#8fd0e6)}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.isl{cursor:pointer;transition:transform .2s}
.isl:hover{filter:brightness(1.04)}
.isl.locked{cursor:not-allowed}
.lbl text{font-size:17px;font-weight:900;fill:var(--ink);font-family:inherit}
.mistg{animation:drift 6s ease-in-out infinite alternate}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-l{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);padding:8px 18px 8px 10px}
.hud-owl{width:48px}
.hud-t{font-weight:900;font-size:1.1rem}.hud-n{color:var(--sub);font-size:.92rem}
.hud-r{display:flex;gap:8px;align-items:center}

/* 島嶼 */
.isl-screen,.hut-screen{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#d8f1f7,#a9dcea);padding:12px;gap:12px;overflow:auto}
.isl-top{display:flex;align-items:center;gap:12px}
.isl-title{flex:1;font-size:1.6rem;font-weight:900;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.isl-title .ln{background:var(--ic);padding:.15em .6em;border-radius:10px;font-size:.7em}
.isl-title .gn{color:var(--sub);font-size:.65em;font-weight:700}
.isl-body{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14px;min-height:0}
.isl-art{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.75) 0 50%,rgba(255,255,255,.55) 50%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.isl-art svg{width:100%;max-height:52vh}
.isl-spirit{position:absolute;width:24%;max-width:130px;left:6%;bottom:16%;filter:grayscale(.5);opacity:.85}
.isl-spirit.awake{filter:none;opacity:1;animation:bob 2.4s ease-in-out infinite}
.isl-cap{font-weight:700;color:var(--sub);text-align:center}
.stages{display:flex;flex-direction:column;gap:10px;justify-content:center}
.stage{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ffffff 0 60%,#f6fbfd 60%);padding:12px 18px;text-align:left;min-height:72px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.stage:active{transform:translateY(2px)}
.sico{width:52px;height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;background:var(--ic);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sico svg{width:46px}
.sname{flex:1;font-size:1.25rem;font-weight:900;display:flex;flex-direction:column}
.sname small{font-size:.75rem;font-weight:500;color:var(--sub)}
.sstar i{font-style:normal;font-size:1.5rem;color:#dcdbe6}.sstar i.on{color:#ffbf1f}
.stage.boss{background:linear-gradient(135deg,#fff4e8 0 60%,#ffe9d6 60%)}
.stage.mist{background:linear-gradient(135deg,#f1eef9 0 60%,#e6e0f5 60%)}
.stage.mist .sico{background:#c9bfe6;color:#fff}
.stage.dis{opacity:.5}

/* 答題 */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#e6f6fa,#bfe6f0);padding:12px 16px 120px;gap:12px;overflow:auto}
.quiz.m-boss,.quiz.m-final{background:linear-gradient(180deg,#f3eefb,#d9cff2)}
.qtop{display:flex;align-items:center;gap:12px}
.qt{font-weight:900;font-size:1.25rem;white-space:nowrap}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:16px;height:16px;background:#fff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:.7}
.dots i.d{background:var(--ic);opacity:1}.dots i.c{background:#ff8a65;opacity:1;transform:scale(1.3)}
.hearts{font-size:1.6rem;color:#ef5b6b;min-width:40px;text-align:right}
.hearts .lost{color:#d6d3e0}.hearts .pop{animation:pop .4s}
.qmain{display:flex;gap:14px;align-items:stretch;flex:1;min-height:0}
.qside{width:min(16vw,130px);flex:0 0 auto;align-self:flex-end;animation:bob 3s ease-in-out infinite}
.qcard{flex:1;background:linear-gradient(160deg,#fff 0 60%,#fafdff 60%);padding:22px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:180px}
.qlabel{font-size:1.25rem;font-weight:700;color:var(--sub)}
.qtext{font-size:1.7rem;font-weight:700;line-height:1.6}
.qword.big{font-size:4.2rem;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.qword .hl{color:#e8603c;text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:10px}
.blank{display:inline-flex;align-items:center;margin:0 .05em}
.blank .bx{display:inline-flex;width:1.05em;height:1.05em;align-items:center;justify-content:center;border:4px dashed #ff8a65;border-radius:12px;color:#ffb59c;font-size:.8em}
.blank .zc{color:#e8603c}
.qchar{font-size:6rem;font-weight:900}
.gap{display:inline-block;background:#fff1ea;border-bottom:4px solid #ff8a65;padding:0 .3em;margin:0 .2em;color:#ffb59c;border-radius:6px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts.long{grid-template-columns:1fr 1fr}
.opt{background:linear-gradient(135deg,#ffffff 0 55%,#f4f9fc 55%);border-radius:18px;min-height:96px;padding:10px 14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.09),0 4px 10px rgba(40,60,90,.1);font-weight:800;transition:transform .12s,background .2s}
.opt:active{transform:translateY(3px)}
.opt.copt{font-size:3rem}
.opt.topt{font-size:1.45rem}
.opt.lopt{font-size:1.2rem;text-align:left;line-height:1.5}
.opt.zopt{font-size:5.2rem;line-height:1;display:flex;align-items:center;justify-content:center}
.opt.zopt .zc{margin:0}
.opt.right{background:#c9f0dc;box-shadow:inset 0 -6px 0 #6cc49a;animation:pop .35s}
.opt.wrong{background:#fbd5d5;box-shadow:inset 0 -6px 0 #e58a8a;animation:shake .35s}
.opt:disabled{color:inherit}
.fb{position:fixed;left:0;right:0;bottom:0;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);background:#fff;padding:16px 22px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:18px;box-shadow:0 -6px 20px rgba(40,60,90,.15);z-index:5}
.fb.show{transform:none}
.fb.ok{background:linear-gradient(135deg,#e9fbf2 0 70%,#d6f5e6 70%)}
.fb.no{background:linear-gradient(135deg,#fff3ef 0 70%,#ffe5dc 70%)}
.fbmark{font-size:1.6rem;font-weight:900;white-space:nowrap}
.fb.ok .fbmark{color:#2f9a6c}.fb.no .fbmark{color:#e0603e}
.fbex{flex:1;font-size:1.15rem;line-height:1.5}
.mnote{display:block;color:#8b7ab0;font-size:.9rem;margin-top:2px}

/* 疊層 */
.overlay{position:fixed;inset:0;background:rgba(40,40,70,.45);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .2s}
.result{background:linear-gradient(160deg,#fff 0 60%,#fbf8ff 60%);width:min(480px,92vw);padding:24px 28px;text-align:center}
.result.small{width:min(440px,92vw)}
.rart{width:120px;margin:0 auto}
.result h2{margin:.2em 0;font-size:1.9rem}
.result p{font-size:1.15rem;line-height:1.6}
.rstars i{font-style:normal;font-size:3rem;color:#e3e1ea;display:inline-block}
.rstars i.on{color:#ffbf1f;animation:popin .5s both}
.rgain{display:inline-block;background:#fff4cc;color:#9a6b00;font-weight:900;padding:.4em 1em;border-radius:12px;margin-bottom:14px}
.rbtns{display:flex;gap:10px;justify-content:center}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e6e3ee;text-align:left;font-weight:700}
.srow.teacher{color:#8b7ab0}
.tip{color:var(--sub);font-size:.9rem!important}
.dlg{align-items:flex-end;padding:16px;background:rgba(40,40,70,.3)}
.dbox{width:min(900px,100%);background:linear-gradient(160deg,#fff 0 65%,#f6fbff 65%);display:flex;gap:16px;padding:16px 22px;align-items:center}
.dpor{width:110px;flex:0 0 110px}
.dtxt{flex:1}
.dname{font-weight:900;color:#e0603e;font-size:1.05rem}
.dline{font-size:1.45rem;font-weight:700;line-height:1.6;min-height:3.2em}
.dnext{text-align:right;color:var(--sub);font-size:.9rem}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:16px;box-shadow:0 6px 18px rgba(40,60,90,.2);font-weight:700;z-index:30;animation:down .3s;max-width:92vw}
.toast.out{opacity:0;transition:opacity .4s}
.tav{width:42px}
.shard{position:fixed;width:14px;height:14px;clip-path:polygon(50% 0,100% 100%,0 100%);pointer-events:none;z-index:40;animation:shard .9s ease-out forwards}

/* 小屋 */
.hut-body{flex:1;display:grid;grid-template-columns:1.6fr 1fr;gap:14px;min-height:0}
.room{background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px}
.room>svg{width:100%;flex:1;min-height:0}
.badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bt{font-weight:900;color:var(--sub);margin-right:4px}
.badge{width:52px;height:52px;background:#eee;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);padding:4px;filter:grayscale(1);opacity:.5}
.badge.on{filter:none;opacity:1;background:#fff4cc}
.shop{background:linear-gradient(160deg,#fff 0 60%,#fbf8ff 60%);padding:16px 20px;overflow:auto}
.shop h3{margin:0 0 8px}
.sitem{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #e6e3ee;font-weight:700;font-size:1.1rem}
.sitem em{font-style:normal;color:#2f9a6c}
.sitem.own{color:var(--sub)}

@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes drift{to{transform:translateX(10px)}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes popin{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes down{from{transform:translate(-50%,-30px);opacity:0}}
@keyframes blink{50%{opacity:.3}}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* 直式平板／手機 */
@media (orientation:portrait),(max-width:760px){
  .isl-body,.hut-body{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
  .qside{display:none}
  .qword.big{font-size:3.2rem}
  .hud{flex-direction:column}
  .fb{flex-wrap:wrap}
}
@media (max-height:620px){.qchar{font-size:4.2rem}.qcard{min-height:130px;padding:14px}.opt{min-height:76px}.opt.zopt{font-size:4.2rem}}
.linkbtn{background:none;color:#5b8db8;font-weight:700;font-size:1rem;margin-top:12px;text-decoration:underline;text-underline-offset:4px;min-height:44px}
.codebox{width:100%;height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.95rem;padding:10px;border:2px solid #dfe7ee;border-radius:12px;word-break:break-all;resize:none;margin:6px 0 14px;-webkit-user-select:text;user-select:text}
.qtext .hl{color:#e8603c;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
</style></head>
<body><div id="app"></div>
<script>// ===== 題庫資料（依翰林 115 學年度三上國語教師手冊 第7～12課） =====
// chars: [生字, 注音(本課語詞中的讀音), 部首, 總筆畫, 語詞]
// idioms: [成語, 意思, 例句(＿＿＿＿為空格)]
// hand 題目：o 的第一個選項是正確答案；zo:true 表示選項是注音
const L = [
{
  n:7, title:'風的味道', genre:'詩歌', island:'微風島', spirit:'嵐嵐', spiritTitle:'風之精靈',
  color:'#8fd6b4', cliff:'#b98a63',
  chars:[
    ['鹹','ㄒㄧㄢˊ','鹵',20,'鹹味'],['蔚','ㄨㄟˋ','艸',15,'蔚藍'],['航','ㄏㄤˊ','舟',10,'回航'],
    ['乘','ㄔㄥˊ','丿',10,'乘風破浪'],['橇','ㄑㄧㄠ','木',16,'雪橇'],['坡','ㄆㄛ','土',8,'山坡'],
    ['野','ㄧㄝˇ','里',11,'原野'],['閉','ㄅㄧˋ','門',11,'閉上眼'],['深','ㄕㄣ','水',11,'深呼吸'],
    ['吸','ㄒㄧ','口',7,'呼吸'],['欣','ㄒㄧㄣ','欠',8,'欣賞'],['賞','ㄕㄤˇ','貝',15,'賞心悅目'],
    ['瞞','ㄇㄢˊ','目',16,'隱瞞']
  ],
  idioms:[
    ['乘風破浪','比喻志向遠大，不怕困難，勇敢向前。','哥哥＿＿＿＿，勇敢追求自己的夢想。'],
    ['野心勃勃','形容想得到不屬於自己的東西，企圖心太強。','那個＿＿＿＿的國王，想占領所有的土地。'],
    ['發人深省','啟發人深刻思考，而有所醒悟。','老師說的故事＿＿＿＿，讓大家想了很久。'],
    ['欣欣向榮','草木生長得很茂盛，比喻事物蓬勃發展。','春天到了，草原上一片＿＿＿＿的景象。'],
    ['賞心悅目','情景很美好，讓人看了心情愉快。','滿園盛開的花朵，令人＿＿＿＿。']
  ],
  hand:{
    shape:[
      {q:'生字小偵探：「野」的右邊是哪一個部件？',o:['予','矛','子','了'],ex:'「野」的右邊是「予」，不是「矛」喔！'},
      {q:'「鹹」左邊的部件是什麼？',o:['鹵','西','田','卤'],ex:'「鹹」的左邊是「鹵」，四個點都向右點。'}
    ],
    word:[
      {q:'「蔚藍的大海」中，「蔚藍」是什麼樣的顏色？',o:['像晴朗天空般的深藍色','灰灰暗暗的顏色','紅紅的顏色','淡淡的綠色'],ex:'「蔚藍」形容像晴天的天空或大海那樣的藍色。'},
      {q:'課文中，「清新」是用來形容什麼？',o:['草香','雪花','大海','鹹味'],ex:'風的身上有「清新的草香」。'},
      {q:'「冰涼」適合用來形容哪一個？',o:['雪花','草香','火爐','太陽'],ex:'課文說：「冰涼的雪花」。'}
    ],
    sent:[
      {q:'「風到處流浪」是把風想像成什麼？',o:['會流浪的人','一條小河','一座山','一朵花'],ex:'把風當成人來寫，這是「轉化」中的擬人法。'},
      {q:'風剛從大海回航，因為他的身上有什麼？',o:['淡淡的鹹味','冰涼的雪花','清新的草香','甜甜的花香'],ex:'大海有淡淡的鹹味。'},
      {q:'風剛由山坡滑下，因為他的身上有什麼？',o:['冰涼的雪花','淡淡的鹹味','清新的草香','溫暖的陽光'],ex:'山坡上有冰涼的雪花。'},
      {q:'風剛在原野打滾，因為他的身上有什麼？',o:['清新的草香','淡淡的鹹味','冰涼的雪花','濃濃的煙味'],ex:'原野上有清新的草香。'},
      {q:'作者用什麼方法知道風去了哪裡？',o:['閉上眼，深呼吸','看地圖','打電話問別人','跟著風跑'],ex:'「閉上眼，深呼吸，風去了哪裡，我都知道。」作者用鼻子感受。'},

<script>// ===== 幾何切面低多邊形美術 =====
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(hex,f){const c=hex2rgb(hex);const t=f>0?255:0,p=Math.min(1,Math.abs(f));return'#'+c.map(v=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0')).join('');}
function pts(a){return a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');}
function poly(p,fill,extra=''){return`<polygon points="${pts(p)}" fill="${fill}" stroke="${fill}" stroke-width=".7" stroke-linejoin="round" ${extra}/>`;}

// 低多邊形色塊（外圈＋內圈＋中心三角化）
function blob(cx,cy,rx,ry,col,seed,n=12,amp=0.22){
  const R=rng(seed),O=[],I=[];
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2-Math.PI/2;const j=0.9+R()*0.16;O.push([cx+Math.cos(a)*rx*j,cy+Math.sin(a)*ry*j]);
    const j2=0.5+R()*0.12;I.push([cx+Math.cos(a+Math.PI/n)*rx*j2,cy+Math.sin(a+Math.PI/n)*ry*j2]);}
  let s='';
  const tri=p=>{const mx=(p[0][0]+p[1][0]+p[2][0])/3,my=(p[0][1]+p[1][1]+p[2][1])/3;
    const d=((cx-mx)/rx*0.6+(cy-my)/ry*0.6);s+=poly(p,shade(col,d*amp+(R()-0.5)*0.09));};
  for(let k=0;k<n;k++){const k2=(k+1)%n;tri([O[k],O[k2],I[k]]);tri([I[k],O[k2],I[k2]]);tri([[cx,cy],I[k],I[k2]]);}
  return{svg:s,O};
}

function islandSVG(cx,cy,rx,ry,col,cliff,seed){
  const R=rng(seed+7);const top=blob(cx,cy,rx,ry,col,seed,14,0.25);
  let s=`<ellipse cx="${cx}" cy="${cy+ry*0.55}" rx="${rx*1.12}" ry="${ry*0.75}" fill="#ffffff" opacity=".35"/>`;
  // 懸崖面
  const O=top.O,h=ry*0.75;
  for(let k=0;k<O.length;k++){const a=O[k],b=O[(k+1)%O.length];if(a[1]<cy-ry*0.05&&b[1]<cy-ry*0.05)continue;
    const a2=[cx+(a[0]-cx)*0.82,a[1]+h],b2=[cx+(b[0]-cx)*0.82,b[1]+h];
    const f=(a[0]<cx?-0.05:-0.25);
    s+=poly([a,b,b2],shade(cliff,f+(R()-0.5)*0.1));s+=poly([a,b2,a2],shade(cliff,f-0.08+(R()-0.5)*0.1));}
  return s+top.svg;
}

function pine(x,y,s,c){const t=[x,y-62*s],l=[x-22*s,y],r=[x+22*s,y],m=[x,y-4*s];
  return poly([[x-3*s,y],[x+3*s,y],[x+3*s,y+8*s],[x-3*s,y+8*s]],'#7a5640')+poly([t,l,m],shade(c,0.12))+poly([t,m,r],shade(c,-0.15))
  +poly([[x,y-80*s],[x-15*s,y-34*s],[x,y-38*s]],shade(c,0.2))+poly([[x,y-80*s],[x,y-38*s],[x+15*s,y-34*s]],shade(c,-0.08));}

function rock(x,y,s,c='#b9b4c4',seed=3){return blob(x,y,14*s,9*s,c,seed,6,0.4).svg;}
function stones(x,y,s){return rock(x,y,s*1.2,'#c9c3d3',11)+rock(x+2*s,y-11*s,s*0.9,'#b3adc0',12)+rock(x-1*s,y-20*s,s*0.65,'#d6d1df',13);}

function house(x,y,s,wall,roof,lit=true){const w=26*s,h=20*s,d=12*s;

  +`<rect x="${x-w+5*s}" y="${y-h+5*s}" width="${7*s}" height="${7*s}" fill="${lit?'#ffe58a':'#6d6a80'}"/><rect x="${x-10*s}" y="${y-h+5*s}" width="${6*s}" height="${15*s}" fill="${shade(wall,-0.35)}"/>`;}
function swing(x,y,s){return`<g stroke="#8a5f45" stroke-width="${3*s}" stroke-linecap="round"><line x1="${x-24*s}" y1="${y}" x2="${x-14*s}" y2="${y-46*s}"/><line x1="${x-4*s}" y1="${y}" x2="${x-14*s}" y2="${y-46*s}"/><line x1="${x+24*s}" y1="${y}" x2="${x+14*s}" y2="${y-46*s}"/><line x1="${x+4*s}" y1="${y}" x2="${x+14*s}" y2="${y-46*s}"/><line x1="${x-16*s}" y1="${y-46*s}" x2="${x+16*s}" y2="${y-46*s}"/></g><g stroke="#e9d3a6" stroke-width="${1.5*s}"><line x1="${x-7*s}" y1="${y-46*s}" x2="${x-7*s}" y2="${y-14*s}"/><line x1="${x+7*s}" y1="${y-46*s}" x2="${x+7*s}" y2="${y-14*s}"/></g>`+poly([[x-10*s,y-14*s],[x+10*s,y-14*s],[x+8*s,y-10*s],[x-8*s,y-10*s]],'#d9776f');}
function lantern(x,y,s){return`<circle cx="${x}" cy="${y}" r="${13*s}" fill="#ffd36b" opacity=".35"/><line x1="${x}" y1="${y-16*s}" x2="${x}" y2="${y-9*s}" stroke="#6b4a3a" stroke-width="${1.5*s}"/>`+poly([[x,y-9*s],[x+7*s,y-4*s],[x+7*s,y+4*s],[x,y+9*s]],'#d9534f')+poly([[x,y-9*s],[x-7*s,y-4*s],[x-7*s,y+4*s],[x,y+9*s]],'#f07a6a');}
function shell(x,y,s,c='#ffd0c2'){let o='';for(let k=0;k<5;k++){const a=Math.PI+k/4*Math.PI;o+=poly([[x,y],[x+Math.cos(a)*11*s,y+Math.sin(a)*11*s],[x+Math.cos(a+Math.PI/4)*11*s,y+Math.sin(a+Math.PI/4)*11*s]],shade(c,k%2?0.12:-0.1));}return o;}
function crab(x,y,s){return`<g stroke="#d4574e" stroke-width="${1.6*s}" stroke-linecap="round"><line x1="${x-8*s}" y1="${y}" x2="${x-14*s}" y2="${y+5*s}"/><line x1="${x+8*s}" y1="${y}" x2="${x+14*s}" y2="${y+5*s}"/><line x1="${x-6*s}" y1="${y+2*s}" x2="${x-11*s}" y2="${y+8*s}"/><line x1="${x+6*s}" y1="${y+2*s}" x2="${x+11*s}" y2="${y+8*s}"/></g>`+blob(x,y,9*s,6*s,'#ef6f5f',21,6,0.3).svg+shell(x+2*s,y-3*s,0.9*s,'#f6c98a')+`<circle cx="${x-4*s}" cy="${y-6*s}" r="${1.6*s}" fill="#333"/><circle cx="${x+0*s}" cy="${y-7*s}" r="${1.6*s}" fill="#333"/>`;}
function boat(x,y,s){return poly([[x-20*s,y],[x+20*s,y],[x+14*s,y+8*s],[x-14*s,y+8*s]],'#e8875f')+poly([[x,y-34*s],[x,y-2*s],[x+18*s,y-4*s]],'#ffffff')+poly([[x,y-30*s],[x,y-2*s],[x-14*s,y-4*s]],'#e7f3f5');}
function car(x,y,s){return poly([[x-20*s,y],[x+20*s,y],[x+20*s,y-9*s],[x+10*s,y-10*s],[x+5*s,y-18*s],[x-12*s,y-18*s],[x-18*s,y-10*s],[x-20*s,y-9*s]],'#5fa8d3')+poly([[x-10*s,y-16*s],[x+3*s,y-16*s],[x+7*s,y-10*s],[x-15*s,y-10*s]],'#d9f1fb')+`<circle cx="${x-11*s}" cy="${y}" r="${4.5*s}" fill="#3b3a4a"/><circle cx="${x+11*s}" cy="${y}" r="${4.5*s}" fill="#3b3a4a"/>`;}
function firework(x,y,s,c){let o=`<g stroke="${c}" stroke-width="${2*s}" stroke-linecap="round">`;for(let k=0;k<10;k++){const a=k/10*Math.PI*2;o+=`<line x1="${x+Math.cos(a)*5*s}" y1="${y+Math.sin(a)*5*s}" x2="${x+Math.cos(a)*15*s}" y2="${y+Math.sin(a)*15*s}"/>`;}return o+'</g>';}

function owlSVG(){
  let s='<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">';
  s+=poly([[22,62],[8,92],[30,96]],'#7a5a48')+poly([[98,62],[112,92],[90,96]],'#6a4c3c');
  s+=blob(60,74,40,46,'#a77b5f',31,12,0.3).svg+blob(60,86,24,28,'#f3e2c4',32,9,0.18).svg;
  s+=poly([[26,34],[34,14],[44,34]],'#8d654f')+poly([[94,34],[86,14],[76,34]],'#7a5a48');
  s+=`<circle cx="44" cy="56" r="15" fill="#fff8e8"/><circle cx="76" cy="56" r="15" fill="#fff8e8"/>`+eyes(45,75,57,7.5,false);
  s+=poly([[56,66],[64,66],[60,76]],'#f2a33a')+poly([[60,66],[64,66],[60,76]],'#d98a22');
  s+=poly([[36,100],[60,94],[84,100],[60,106]],'#6cc49a')+poly([[60,100],[70,104],[64,118]],'#58b086');
  s+=`<ellipse cx="34" cy="72" rx="5" ry="3" fill="#ff9db5" opacity=".6"/><ellipse cx="86" cy="72" rx="5" ry="3" fill="#ff9db5" opacity=".6"/>`;
  s+=poly([[44,118],[52,118],[48,124]],'#f2a33a')+poly([[68,118],[76,118],[72,124]],'#f2a33a');

}
const SPIRIT_COL=['#8fe0c0','#ffb38f','#7fd18d','#ffaecb','#ffe08a','#c6b0ff'];
function spiritSVG(i,sleep=false){

  if(i===1)s+=`<g stroke="#e46a50" stroke-width="4" stroke-linecap="round"><line x1="28" y1="88" x2="14" y2="78"/><line x1="92" y1="88" x2="106" y2="78"/></g>`+poly([[8,70],[20,72],[14,82]],'#ef6f5f')+poly([[112,70],[100,72],[106,82]],'#ef6f5f');
  if(i===2){s+=poly([[40,44],[50,24],[56,46]],'#3f9e63')+poly([[56,42],[64,18],[72,44]],'#4eae6f')+poly([[70,46],[80,26],[84,48]],'#3f9e63');}

  s+=`<path d="M48 96 q 12 -8 24 0" stroke="#2e2a40" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

function portrait(who){if(who==='owl')return owlSVG();if(who==='king')return kingSVG();if(typeof who==='string'&&who.startsWith('sleep'))return spiritSVG(+who.slice(5),true);return spiritSVG(who,false);}
</script>
<script>// ===== 翰林三上國語守護島 主程式 =====
const STORE='hanlin3a-guardian-island-v1';
const STAGES=[
  {k:'read',name:'讀音小徑',icon:'ㄅ',desc:'認讀生字的注音'},
  {k:'shape',name:'字形石陣',icon:'字',desc:'部首、筆畫與字形'},
  {k:'word',name:'語詞花園',icon:'花',desc:'語詞與成語'},
  {k:'sent',name:'句子橋',icon:'句',desc:'句型與課文理解'}
];
const SHOP=[
  {id:'plant',name:'窗邊盆栽',cost:20},{id:'chime',name:'微風風鈴',cost:25},{id:'shellh',name:'貝殼掛飾',cost:30},
  {id:'rug',name:'幾何地毯',cost:35},{id:'books',name:'小書架',cost:40},{id:'lamp',name:'平安燈籠',cost:45},
  {id:'star',name:'星星吊燈',cost:60},{id:'swing',name:'迷你秋千',cost:80}
];
const POS=[[180,520],[430,600],[665,505],[905,590],[1050,365],[780,230],[430,280]];

let DB={profiles:{},current:null,sound:true,unlockAll:false};
function load(){try{const s=localStorage.getItem(STORE);if(s)DB=Object.assign(DB,JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));}catch(e){}}
function P(){return DB.profiles[DB.current];}
function newProfile(name){const id='p'+Date.now();DB.profiles[id]={name,light:0,stars:{},boss:{},mist:{},items:[],seen:{},finalDone:false};DB.current=id;save();}

const $=s=>document.querySelector(s);
const app=()=>$('#app');
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}

// ===== 注音（直式、聲調在右上） =====
function zyCol(z){let tone='',s=z;const last=z.slice(-1);if('ˊˇˋ˙'.includes(last)){tone=last;s=z.slice(0,-1);}
  const syms=[...s];const n=syms.length;
  return`<span class="zc" style="--n:${n}">${tone==='˙'?'<i class="lt">˙</i>':''}${syms.map(c=>`<b>${c}</b>`).join('')}${tone&&tone!=='˙'?`<i class="tn">${tone}</i>`:''}</span>`;}
function zyChar(c,z){return`<span class="zy"><span class="h">${c}</span>${zyCol(z)}</span>`;}

// ===== 音效 =====
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(a,f,t0,d,type='sine',v=0.14){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+0.05);}
function sfx(n){if(!DB.sound)return;const a=ac();if(!a)return;try{if(a.state==='suspended')a.resume();}catch(e){}const t=a.currentTime;
  if(n==='tap')tone(a,560,t,0.07,'sine',0.07);
  if(n==='ok'){tone(a,660,t,0.14,'triangle');tone(a,990,t+0.09,0.22,'triangle');}
  if(n==='no'){tone(a,240,t,0.18,'square',0.05);tone(a,180,t+0.12,0.25,'square',0.05);}
  if(n==='win')[523,659,784,1047,1319].forEach((f,i)=>tone(a,f,t+i*0.1,0.32,'triangle',0.12));
  if(n==='mist'){const len=0.5,b=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3000,t+len);g.gain.value=0.18;s.connect(f).connect(g).connect(a.destination);s.start(t);tone(a,880,t+0.2,0.3,'sine',0.08);}
}

// ===== 小工具 =====
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=`<div class="tav">${owlSVG()}</div><div>${esc(msg)}</div>`;document.body.appendChild(t);setTimeout(()=>t.classList.add('out'),2300);setTimeout(()=>t.remove(),2800);}
function burst(el,colors,n=14){const r=el.getBoundingClientRect();for(let k=0;k<n;k++){const p=document.createElement('i');p.className='shard';
  p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';p.style.background=colors[k%colors.length];
  const a=Math.random()*Math.PI*2,d=60+Math.random()*120;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(Math.sin(a)*d-60)+'px');p.style.setProperty('--rot',(Math.random()*540)+'deg');
  document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}}
function unlocked(i){const p=P();if(DB.unlockAll)return true;if(i===6)return [0,1,2,3,4,5].every(j=>p.boss[j]);return i===0||!!p.boss[i-1];}
function stageDone(i){const p=P();return STAGES.filter(s=>p.stars[i+'-'+s.k]).length;}
function mistOf(i){const p=P();return (p.mist[i]||[]);}
function addMist(i,desc){const p=P();p.mist[i]=p.mist[i]||[];if(!p.mist[i].includes(desc))p.mist[i].push(desc);save();}
function delMist(i,desc){const p=P();p.mist[i]=(p.mist[i]||[]).filter(d=>d!==desc);save();}

// ===== 題目產生 =====
function charsOf(li){return L[li].chars.map(c=>({c:c[0],z:c[1],r:c[2],s:c[3],w:c[4],noRead:!!c[5]}));}
const ALL_R=[...new Set(L.flatMap(l=>l.chars.map(c=>c[2])))];
function toneVariants(z){const b=z.replace(/[ˊˇˋ˙]/g,'');return[b,b+'ˊ',b+'ˇ',b+'ˋ'];}
function hlWord(w,c){return[...w].map(ch=>ch===c?`<span class="hl">${ch}</span>`:ch).join('');}
function blankWord(w,c,z){return[...w].map(ch=>ch===c?`<span class="blank"><span class="bx">？</span>${zyCol(z)}</span>`:`<span class="wch">${ch}</span>`).join('');}

function build(desc){
  const [lis,t,k]=desc.split('|');
  if(lis==='F'){const h=FINAL[+k];return mkHand(h,desc);}
  const li=+lis,l=L[li];
  if(t==='h'){const m=k.match(/^([a-z]+)(\d+)$/);return mkHand(l.hand[m[1]][+m[2]],desc);}
  const cs=charsOf(li);
  if(t==='rz'){const it=cs.find(x=>x.c===k);const opts=new Set([it.z]);
    shuffle(toneVariants(it.z)).forEach(z=>{if(opts.size<3)opts.add(z);});
    shuffle(cs.map(x=>x.z)).forEach(z=>{if(opts.size<4)opts.add(z);});
    return{desc,prompt:`<div class="qlabel">念念看，<b>畫底線的字</b>怎麼念？</div><div class="qword big">${hlWord(it.w,it.c)}</div>`,
      opts:shuffle([...opts]).map(z=>({v:z,h:zyCol(z),cls:'zopt'})),ans:it.z,ex:`「${it.w}」的「${it.c}」念 ${it.z}。`};}
  if(t==='rc'){const it=cs.find(x=>x.c===k);const pool=shuffle(cs.filter(x=>x.z!==it.z&&!it.w.includes(x.c))).slice(0,3).map(x=>x.c);
    return{desc,prompt:`<div class="qlabel">看注音，選出正確的字</div><div class="qword big">${blankWord(it.w,it.c,it.z)}</div>`,
      opts:shuffle([it.c,...pool]).map(c=>({v:c,h:c,cls:'copt'})),ans:it.c,ex:`「${it.w}」的「${it.c}」，注音是 ${it.z}。`};}
  if(t==='rad'){const it=cs.find(x=>x.c===k);const pool=sample(ALL_R.filter(r=>r!==it.r),3);
    return{desc,prompt:`<div class="qlabel">「${it.c}」的部首是什麼？</div><div class="qchar">${zyChar(it.c,it.z)}</div>`,
      opts:shuffle([it.r,...pool]).map(r=>({v:r,h:r,cls:'copt'})),ans:it.r,ex:`「${it.c}」的部首是「${it.r}」。`};}
  if(t==='stk'){const it=cs.find(x=>x.c===k);const c=new Set([it.s]);shuffle([-3,-2,-1,1,2,3]).forEach(d=>{if(c.size<4&&it.s+d>0)c.add(it.s+d);});
    return{desc,prompt:`<div class="qlabel">「${it.c}」一共有幾畫？</div><div class="qchar">${zyChar(it.c,it.z)}</div>`,
      opts:shuffle([...c]).map(n=>({v:n,h:n+' 畫',cls:'topt'})),ans:it.s,ex:`「${it.c}」總共 ${it.s} 畫。`};}
  if(t==='im'||t==='if'){const it=l.idioms.find(x=>x[0]===k);let others=l.idioms.filter(x=>x[0]!==k).map(x=>x[0]);
    if(others.length<3)others=others.concat(L.flatMap(x=>x.idioms.map(y=>y[0])).filter(y=>y!==k&&!others.includes(y)));
    const opts=shuffle([k,...sample(others,3)]).map(x=>({v:x,h:x,cls:'topt'}));
    const prompt=t==='im'?`<div class="qlabel">哪一個成語的意思是：</div><div class="qtext">「${esc(it[1])}」</div>`
      :`<div class="qlabel">選出最適合填入空格的成語</div><div class="qtext">${esc(it[2]).replace('＿＿＿＿','<span class="gap">？？？？</span>')}</div>`;
    return{desc,prompt,opts,ans:k,ex:`${k}：${it[1]}`};}
}
function mkHand(h,desc){const lg=h.o.some(x=>x.length>8),one=h.o.every(x=>x.length===1);const opts=shuffle(h.o).map(x=>({v:x,h:h.zo?zyCol(x):esc(x),cls:h.zo?'zopt':one?'copt':(lg?'lopt':'topt')}));
  return{desc,prompt:`<div class="qtext">${esc(h.q).replace(/〔(.+?)〕/g,'<span class="hl">$1</span>')}</div>`,opts,ans:h.o[0],ex:h.ex};}

function poolFor(li,stage){
  const l=L[li],cs=charsOf(li),H=k=>(l.hand[k]||[]).map((_,j)=>`${li}|h|${k}${j}`);
  if(stage==='read'){const rd=cs.filter(c=>!c.noRead);const hr=H('read');
    const a=sample(rd,6);let list=a.slice(0,3).map(c=>`${li}|rz|${c.c}`).concat(a.slice(3,6).map(c=>`${li}|rc|${c.c}`));
    if(hr.length){const n=Math.min(3,hr.length);list=sample(list,6-n).concat(sample(hr,n));}return shuffle(list);}
  if(stage==='shape'){const a=sample(cs,5);const hs=H('shape');
    let list=a.slice(0,3).map(c=>`${li}|rad|${c.c}`).concat(a.slice(3,5).map(c=>`${li}|stk|${c.c}`));
    if(hs.length)list=sample(list,6-Math.min(3,hs.length)).concat(sample(hs,Math.min(3,hs.length)));else list.push(`${li}|rad|${sample(cs,1)[0].c}`);
    return shuffle(list);}
  if(stage==='word'){const ids=l.idioms.map(x=>x[0]);const a=sample(ids,4);
    return shuffle([`${li}|im|${a[0]}`,`${li}|if|${a[1]}`].concat(sample(H('word'),4)));}
  if(stage==='sent')return sample(H('sent'),6);
  if(stage==='boss'){return shuffle(STAGES.flatMap(s=>sample(poolFor(li,s.k),2)));}
}

// ===== 畫面：標題 =====
function screenTitle(){
  const ps=Object.entries(DB.profiles).sort((a,b)=>a[0]<b[0]?-1:1);
  app().innerHTML=`<div class="title-screen">
    <div class="title-bg">${titleArt()}</div>
    <div class="title-card facet">
      <div class="title-owl">${owlSVG()}</div>
      <h1><span class="t1">翰林三上國語</span><span class="t2">守護島</span></h1>
      <p class="sub">第七課～第十二課 闖關複習</p>
      <div class="plist">${ps.map(([id,p])=>`<button class="pbtn" data-id="${id}"><span class="pname">${esc(p.name)}</span><span class="plight">✦ ${p.light}</span></button>`).join('')}</div>
      <div class="newp"><input id="pname" maxlength="10" placeholder="輸入守護者名字（例如：12號 小明）"><button class="btn primary" id="pgo">新的守護者</button></div>
      <button class="linkbtn" id="pimp">換了平板？用進度碼接回進度</button>
    </div></div>`;
  app().querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{sfx('tap');DB.current=b.dataset.id;save();screenMap();});
  $('#pimp').onclick=()=>{sfx('tap');importBox();};
  $('#pgo').onclick=()=>{const n=$('#pname').value.trim();if(!n){$('#pname').focus();toast('先輸入你的名字喔！');return;}sfx('tap');newProfile(n);
    dialog(STORY.prologue,()=>{P().seen.prologue=true;save();screenMap();});};
}
function titleArt(){let s='<svg viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">'+seaBG();
  [[150,560,0],[1040,600,3],[1080,200,5],[170,190,2]].forEach(([x,y,i])=>{s+=islandSVG(x,y,110,55,L[i].color,L[i].cliff,i*31+5)+islandDecor(i,x,y-8,1);});return s+'</svg>';}
function seaBG(){const R=rng(99);let s=`<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdeef5"/><stop offset="1" stop-color="#8fd0e6"/></linearGradient>
  <filter id="gray"><feColorMatrix type="saturate" values="0.12"/></filter></defs><rect x="-1200" y="-900" width="3600" height="2520" fill="url(#sea)"/>`;
  for(let k=0;k<70;k++){const x=R()*1200,y=R()*720,r=20+R()*50;s+=`<polygon points="${x},${y} ${x+r},${y+r*0.3} ${x+r*0.3},${y+r*0.8}" fill="#ffffff" opacity="${(0.05+R()*0.1).toFixed(2)}"/>`;}
  return s;}

// ===== 畫面：地圖 =====
function screenMap(){
  const p=P();if(!p){screenTitle();return;}
  let svg='<svg class="mapsvg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">'+seaBG();
  svg+=`<polyline points="${POS.slice(0,6).map(q=>q.join(',')).join(' ')}" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round" opacity=".8"/>`;
  svg+=`<line x1="${POS[5][0]}" y1="${POS[5][1]}" x2="${POS[6][0]}" y2="${POS[6][1]}" stroke="#ffffff" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round" opacity=".5"/>`;
  for(let i=0;i<7;i++){const[x,y]=POS[i];const fin=i===6;const un=unlocked(i);
    const col=fin?'#b6a9d1':L[i].color,cl=fin?'#7d6b8f':L[i].cliff;
    const done=fin?(p.finalDone?5:0):stageDone(i)+(p.boss[i]?1:0);
    const op=!un?0.92:(fin?(p.finalDone?0:0.8):(1-done/5)*0.8);
    svg+=`<g class="isl ${un?'':'locked'}" data-i="${i}"><g ${un?'':'filter="url(#gray)"'}>${islandSVG(x,y,fin?120:100,fin?58:50,col,cl,i*31+5)}${islandDecor(i,x,y-6,fin?1.1:0.95)}</g>${mistSVG(x,y-10,1,op,i*17+3)}`;
    const label=fin?'迷霧島':`第${L[i].n}課 ${L[i].island}`;
    svg+=`<g class="lbl"><rect x="${x-78}" y="${y+56}" width="156" height="34" rx="17" fill="${un?'#ffffff':'#e6e3ee'}" opacity=".95"/><text x="${x}" y="${y+79}" text-anchor="middle">${label}</text></g>`;
    if(!fin&&un){const m=mistOf(i).length;svg+=`<g transform="translate(${x+70},${y-40})">${[0,1,2,3].map(k=>`<polygon points="${k*13},0 ${k*13+11},0 ${k*13+5.5},-10" fill="${p.stars[i+'-'+STAGES[k].k]?'#ffcf4a':'#ffffff'}" stroke="#d9a400" stroke-width="${p.stars[i+'-'+STAGES[k].k]?1:0}" opacity="${p.stars[i+'-'+STAGES[k].k]?1:0.7}"/>`).join('')}${p.boss[i]?`<circle cx="62" cy="-5" r="7" fill="${SPIRIT_COL[i]}" stroke="#fff" stroke-width="2"/>`:''}</g>`;
      if(m)svg+=`<g transform="translate(${x-92},${y-46})"><circle r="16" fill="#8b7ab0"/><text y="6" text-anchor="middle" fill="#fff" font-size="16" font-weight="900">${m}</text></g>`;}

// ===== 答題 =====
let Q=null;
function startQuiz(o){
  let list;
  if(o.mode==='stage')list=poolFor(o.i,o.stage);
  else if(o.mode==='boss')list=poolFor(o.i,'boss');
  else if(o.mode==='mist')list=mistOf(o.i).slice(0,10);
  else if(o.mode==='final'){const f=sample(FINAL.map((_,k)=>`F|h|${k}`),8);const mix=[0,1,2,3,4,5].map(li=>sample(poolFor(li,sample(['read','shape','word','sent'],1)[0]),1)[0]);list=f.concat(sample(mix,4));}
  Q=Object.assign({list,idx:0,wrong:0,gain:0,hearts:o.mode==='boss'?3:(o.mode==='final'?5:0)},o);
  showQ();
}
function qTitle(){if(Q.mode==='stage')return STAGES.find(s=>s.k===Q.stage).name;if(Q.mode==='boss')return'喚醒'+L[Q.i].spirit;if(Q.mode==='mist')return'驅散迷霧';return'挑戰迷霧王';}
function showQ(){
  const q=build(Q.list[Q.idx]);Q.cur=q;Q.done=false;
  const isBoss=Q.mode==='boss'||Q.mode==='final';
  app().innerHTML=`<div class="quiz m-${Q.mode}" style="--ic:${Q.i==='F'?'#b6a9d1':L[Q.i].color}">
    <div class="qtop"><button class="btn icon" id="quit">✕</button><div class="qt">${qTitle()}</div>
      <div class="dots">${Q.list.map((_,k)=>`<i class="${k<Q.idx?'d':k===Q.idx?'c':''}"></i>`).join('')}</div>
      <div class="hearts">${Q.hearts?Array.from({length:isBoss?(Q.mode==='boss'?3:5):0},(_,k)=>`<span class="${k<Q.hearts?'':'lost'}">♥</span>`).join(''):''}</div></div>
    <div class="qmain">
      <div class="qside">${Q.mode==='final'?kingSVG():Q.mode==='boss'?spiritSVG(Q.i,true):owlSVG()}</div>
      <div class="qcard facet">${q.prompt}</div>
    </div>
    <div class="opts ${q.opts.some(o=>o.cls==='lopt')?'long':''}">${q.opts.map((o,k)=>`<button class="opt ${o.cls}" data-k="${k}">${o.h}</button>`).join('')}</div>
    <div class="fb" id="fb"></div></div>`;
  $('#quit').onclick=()=>{sfx('tap');confirmBox('要離開這一關嗎？這一關的進度不會保存。',()=>back());};
  app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
}
function back(){if(Q.i==='F')screenFinal();else screenIsland(Q.i);}
function answer(k,btn){
  if(Q.done)return;Q.done=true;const q=Q.cur;const ok=q.opts[k].v===q.ans;
  const btns=app().querySelectorAll('.opt');btns.forEach((b,j)=>{b.disabled=true;if(q.opts[j].v===q.ans)b.classList.add('right');});
  const isl=Q.i;
  if(ok){sfx(Q.mode==='mist'?'mist':'ok');burst(btn,Q.mode==='mist'?['#d8d3e6','#ffffff','#b6a9d1']:['#ffcf4a','#8fd6b4','#ff9db5','#9ad0f5']);
    const g=Q.mode==='mist'?3:2;Q.gain+=g;P().light+=g;
    if(Q.mode==='mist')delMist(isl,q.desc);}
  else{sfx('no');btn.classList.add('wrong');Q.wrong++;addMist(Q.mode==='final'&&q.desc[0]!=='F'?q.desc.split('|')[0]:isl,q.desc);
    if(Q.hearts){Q.hearts--;const hs=app().querySelectorAll('.hearts span');if(hs[Q.hearts])hs[Q.hearts].classList.add('lost','pop');}}
  save();
  const last=Q.idx>=Q.list.length-1,dead=(Q.mode==='boss'||Q.mode==='final')&&Q.hearts<=0;
  const fb=$('#fb');fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<div class="fbmark">${ok?'答對了！':'再想想看～'}</div><div class="fbex">${esc(q.ex)}${!ok&&Q.mode!=='mist'?'<span class="mnote">這題變成了迷霧，記得回來驅散它！</span>':''}</div><button class="btn primary" id="next">${dead?'看結果':last?'完成':'下一題 →'}</button>`;
  $('#next').onclick=()=>{sfx('tap');if(dead||last)finish(dead);else{Q.idx++;showQ();}};
}
function finish(dead){
  const p=P();let title,body,stars=0,extra=0,after=null;
  const n=Q.list.length;
  if(dead){title='迷霧太濃了……';body='愛心用完了，休息一下再挑戰一次吧！答錯的題目已經變成迷霧，可以先去「驅散迷霧」練習。';}
  else if(Q.mode==='stage'){stars=Q.wrong===0?3:Q.wrong<=2?2:1;extra=5+stars*2;const key=Q.i+'-'+Q.stage;p.stars[key]=Math.max(p.stars[key]||0,stars);
    title=['','完成關卡！','做得很好！','太厲害了！'][stars];body=`答對 ${n-Q.wrong} / ${n} 題`;}
  else if(Q.mode==='boss'){const first=!p.boss[Q.i];p.boss[Q.i]=true;extra=first?20:8;title=`喚醒了${L[Q.i].spirit}！`;body=`答對 ${n-Q.wrong} / ${n} 題`;if(first)after=STORY.clear[Q.i];}
  else if(Q.mode==='mist'){const left=mistOf(Q.i).length;title='迷霧散開了！';body=`驅散了 ${n-Q.wrong} 團迷霧`+(left?`，還剩 ${left} 團。`:'，這裡的迷霧全部消失了！');}
  else{const first=!p.finalDone;p.finalDone=true;extra=first?50:15;title='打敗迷霧王！';body=`答對 ${n-Q.wrong} / ${n} 題`;if(first)after=STORY.finalClear;}
  p.light+=extra;save();
  if(!dead)sfx('win');
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="result facet">
    <div class="rart">${Q.mode==='boss'&&!dead?spiritSVG(Q.i):Q.mode==='final'&&!dead?owlSVG():dead?kingSVG():owlSVG()}</div>
    <h2>${title}</h2>${stars?`<div class="rstars">${[1,2,3].map(k=>`<i class="${k<=stars?'on':''}" style="animation-delay:${k*0.15}s">★</i>`).join('')}</div>`:''}
    <p>${body}</p><div class="rgain">✦ 獲得守護光 ${Q.gain+extra}</div>
    <div class="rbtns"><button class="btn" id="again">再玩一次</button><button class="btn primary" id="ok">回到${Q.i==='F'?'迷霧島':'島上'}</button></div></div>`;
  document.body.appendChild(ov);
  if(!dead)setTimeout(()=>burst(ov.querySelector('h2'),['#ffcf4a','#8fd6b4','#ff9db5','#9ad0f5','#c6b4f2'],26),150);
  const mode=Q.mode,i=Q.i,stage=Q.stage;
  ov.querySelector('#ok').onclick=()=>{sfx('tap');ov.remove();back();if(after)dialog(after);};
  ov.querySelector('#again').onclick=()=>{sfx('tap');ov.remove();if(mode==='mist'&&!mistOf(i).length){back();return;}startQuiz({mode,i,stage});if(after)dialog(after);};
}

function dialog(lines,done){
  const p=P();let k=0;const ov=document.createElement('div');ov.className='overlay dlg';document.body.appendChild(ov);
  const name=w=>w==='owl'?'貓頭鷹文文':w==='king'?'迷霧王':(typeof w==='string'&&w.startsWith('sleep'))?L[+w.slice(5)].spiritTitle+L[+w.slice(5)].spirit:L[w].spiritTitle+L[w].spirit;
  const show=()=>{const[w,t]=lines[k];const txt=t.replace('{name}',p?p.name:'');
    ov.innerHTML=`<div class="dbox facet"><div class="dpor">${portrait(w)}</div><div class="dtxt"><div class="dname">${name(w)}</div><div class="dline"></div><div class="dnext">${k<lines.length-1?'點一下繼續 ▶':'點一下開始 ▶'}</div></div></div>`;
    ov.querySelector('.dline').textContent=txt;};
  ov.onclick=()=>{sfx('tap');k++;if(k>=lines.length){ov.remove();if(done)done();}else show();};
  show();
}

  document.body.appendChild(ov);ov.querySelector('#n').onclick=()=>{sfx('tap');ov.remove();};ov.querySelector('#y').onclick=()=>{sfx('tap');ov.remove();yes();};}

  const R=rng(5);for(let x=0;x<6;x++)for(let y=0;y<2;y++){const x0=x*100,y0=280+y*60;s+=poly([[x0,y0],[x0+100,y0],[x0+100,y0+60]],shade('#d9b48a',(R()-0.5)*0.15))+poly([[x0,y0],[x0+100,y0+60],[x0,y0+60]],shade('#d9b48a',(R()-0.5)*0.15-0.05));}

    ov.querySelector('#sowl').onclick=()=>{taps++;if(taps===5){sfx('win');draw();}};
    ov.querySelector('#snd').onclick=()=>{DB.sound=!DB.sound;save();sfx('tap');draw();};
    ov.querySelector('#code').onclick=()=>{sfx('tap');ov.remove();exportBox();};
    ov.querySelector('#sw').onclick=()=>{ov.remove();screenTitle();};
    ov.querySelector('#rs').onclick=()=>{ov.remove();confirmBox(`確定要清除「${P().name}」的所有紀錄嗎？`,()=>{delete DB.profiles[DB.current];DB.current=null;save();screenTitle();});};
    const ua=ov.querySelector('#ua');if(ua)ua.onclick=()=>{DB.unlockAll=!DB.unlockAll;save();draw();};
    ov.querySelector('#cl').onclick=()=>{ov.remove();screenMap();};};
  draw();document.body.appendChild(ov);
}

// ===== 進度碼 =====
function chk(t){let h=0;for(let k=0;k<t.length;k++)h=(h*31+t.charCodeAt(k))%1296;return h.toString(36).padStart(2,'0').toUpperCase();}
function packProfile(p){
  return{v:1,n:p.name,l:p.light,
    s:[0,1,2,3,4,5].map(i=>STAGES.map(st=>p.stars[i+'-'+st.k]||0).join('')).join(''),
    b:[0,1,2,3,4,5].map(i=>p.boss[i]?1:0).join('')+(p.finalDone?1:0),
    i:p.items.map(id=>SHOP.findIndex(x=>x.id===id)).filter(x=>x>=0).join(''),
    m:p.mist,e:Object.keys(p.seen).join(',')};}
function unpackProfile(o){
  if(!o||o.v!==1||typeof o.n!=='string'||typeof o.s!=='string'||o.s.length!==24)throw 0;
  const p={name:o.n.slice(0,10),light:Math.max(0,+o.l||0),stars:{},boss:{},mist:{},items:[],seen:{},finalDone:o.b[6]==='1'};
  [0,1,2,3,4,5].forEach(i=>{STAGES.forEach((st,k)=>{const v=+o.s[i*4+k];if(v>0&&v<=3)p.stars[i+'-'+st.k]=v;});if(o.b[i]==='1')p.boss[i]=true;});
  [...(o.i||'')].forEach(c=>{const it=SHOP[+c];if(it&&!p.items.includes(it.id))p.items.push(it.id);});
  if(o.m&&typeof o.m==='object')Object.keys(o.m).forEach(k=>{if(Array.isArray(o.m[k]))p.mist[k]=o.m[k].filter(d=>typeof d==='string'&&d.split('|').length===3);});
  (o.e||'').split(',').filter(Boolean).forEach(k=>p.seen[k]=true);
  return p;}
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0));}
async function encodeProfile(p){
  let bytes=new TextEncoder().encode(JSON.stringify(packProfile(p))),tag='A';
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer());tag='B';}catch(e){}}
  const body=tag+b64u(bytes);return 'SH'+body+chk(body);}
async function decodeProfile(code){
  code=code.replace(/\s+/g,'');
  if(!code.startsWith('SH')||code.length<8)throw new Error('format');
  const body=code.slice(2,-2);if(chk(body)!==code.slice(-2))throw new Error('check');
  let bytes=unb64u(body.slice(1));
  if(body[0]==='B'){const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer());}
  else if(body[0]!=='A')throw new Error('format');
  return unpackProfile(JSON.parse(new TextDecoder().decode(bytes)));}
async function exportBox(){
  const code=await encodeProfile(P());
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="result facet small"><h2>${esc(P().name)} 的進度碼</h2>
    <p class="tip">換平板時，在標題頁按「用進度碼接回進度」，貼上這串文字就能繼續玩。<br>進度碼是「現在」的進度，之後玩過記得再產生一次新的。</p>
    <textarea class="codebox" readonly>${code}</textarea>
    <div class="rbtns"><button class="btn" id="cl">關閉</button><button class="btn primary" id="cp">複製進度碼</button></div></div>`;
  document.body.appendChild(ov);const ta=ov.querySelector('textarea');
  ta.onclick=()=>ta.select();
  ov.querySelector('#cl').onclick=()=>{sfx('tap');ov.remove();};
  ov.querySelector('#cp').onclick=async()=>{sfx('tap');try{await navigator.clipboard.writeText(code);toast('複製好了！可以貼到 Google Classroom 或交給老師保管。');}catch(e){ta.select();toast('請長按上面的文字，選「拷貝」。');}};
}
function importBox(){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="result facet small"><div class="rart">${owlSVG()}</div><h2>用進度碼接回進度</h2>
    <p class="tip">把進度碼貼在下面（SH 開頭的一串文字）。</p>
    <textarea class="codebox" id="ci" placeholder="在這裡貼上進度碼"></textarea>
    <div class="rbtns"><button class="btn" id="cl">取消</button><button class="btn primary" id="ok">接回進度</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cl').onclick=()=>{sfx('tap');ov.remove();};
  ov.querySelector('#ok').onclick=async()=>{
    let p;try{p=await decodeProfile(ov.querySelector('#ci').value);}catch(e){sfx('no');toast('這個進度碼好像不完整，請再檢查一次喔！');return;}
    const apply=()=>{const same=Object.keys(DB.profiles).find(id=>DB.profiles[id].name===p.name);
      const id=same||('p'+Date.now());DB.profiles[id]=p;DB.current=id;save();ov.remove();sfx('win');toast(`歡迎回來，${p.name}！`);screenMap();};
    if(Object.values(DB.profiles).some(x=>x.name===p.name))confirmBox(`這台平板已經有「${p.name}」，要用進度碼的進度取代嗎？`,apply);else apply();};
}

// ===== 啟動 =====
load();
if(DB.current&&DB.profiles[DB.current])screenMap();else screenTitle();
</script>
</body></html>
